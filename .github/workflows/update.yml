
name: Update Quick VPN

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "collector.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: quick-vpn-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install curl
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Install Xray-core
        run: |
          curl -fsSL \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip \
            -o /tmp/xray.zip
          python -c "import zipfile; zipfile.ZipFile('/tmp/xray.zip').extract('xray', '/tmp/xray-bin')"
          chmod +x /tmp/xray-bin/xray
          echo "XRAY_PATH=/tmp/xray-bin/xray" >> "$GITHUB_ENV"

      - name: Collect and test servers
        run: python collector.py

      - name: Commit updated subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sub.txt public/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update tested VPN servers"
            git push
          else
            echo "No changes to publish"
          fi
